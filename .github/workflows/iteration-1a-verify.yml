name: Backend CI — Iteration 1a + 1b

on:
  push:
    branches:
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verify three containers healthy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API on port 8000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "API is ready."
              break
            fi
            echo "  attempt $i/30 — not ready yet, sleeping 1s"
            sleep 1
          done

      - name: "[1/4] All containers running"
        run: |
          docker compose ps
          # Fail if any service is not running/healthy
          if docker compose ps --format json | grep -qE '"Status":"(exited|dead|removing)"'; then
            echo "ERROR: one or more containers are not running"
            exit 1
          fi

      - name: "[2/4] API health check"
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/)
          echo "Response: $RESPONSE"
          python3 -c "
          import sys, json
          r = json.loads('$RESPONSE')
          assert r.get('success') == True or 'status' in str(r), f'unexpected: {r}'
          print('PASS')
          "

      - name: "[3/4] PostgreSQL accepting connections"
        run: |
          OUTPUT=$(docker compose exec -T postgres pg_isready -U chef -d chef_agent)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "accepting connections"; then
            echo "ERROR: pg_isready did not return 'accepting connections'"
            exit 1
          fi
          echo "PASS"

      - name: "[4/4] Redis responds to PING"
        run: |
          OUTPUT=$(docker compose exec -T redis redis-cli ping)
          echo "$OUTPUT"
          if [ "$OUTPUT" != "PONG" ]; then
            echo "ERROR: expected PONG, got: $OUTPUT"
            exit 1
          fi
          echo "PASS"

      - name: Print container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  verify-1b:
    name: Verify FastAPI skeleton (1b)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "API is ready."; break
            fi
            echo "  attempt $i/30 — sleeping 1s"; sleep 1
          done

      - name: "[1/3] Root route returns standard envelope"
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/)
          echo "Response: $RESPONSE"
          python3 -c "
          import sys, json
          r = json.loads('$RESPONSE')
          assert r['success'] == True
          assert 'data' in r and 'meta' in r and 'error' in r
          assert r['data']['health'] == '/api/v1/health'
          assert 'request_id' in r['meta']
          assert 'latency_ms' in r['meta']
          print('PASS')
          "

      - name: "[2/3] X-Request-ID header present on every response"
        run: |
          HEADER=$(curl -sI http://localhost:8000/ | grep -i x-request-id)
          echo "$HEADER"
          [ -n "$HEADER" ] && echo "PASS" || (echo "ERROR: missing X-Request-ID" && exit 1)

      - name: "[3/3] Unknown route returns 404 with envelope"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8000/does-not-exist)
          [ "$STATUS" = "404" ] && echo "PASS" || \
            (echo "ERROR: expected 404, got $STATUS" && exit 1)

      - name: Print container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
